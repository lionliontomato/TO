<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>番茄的金庫｜查詢頁</title>
  <meta name="description" content="番茄的金庫查詢頁，只呈現 Google 試算表 A～E 欄資料。" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sky-glow"></div>
  <div class="mist mist-a"></div>
  <div class="mist mist-b"></div>

  <div class="floating-icons" aria-hidden="true">
    <span style="--x:8%; --delay:0s; --duration:13s;">☁️</span>
    <span style="--x:18%; --delay:2s; --duration:16s;">🪶</span>
    <span style="--x:31%; --delay:5s; --duration:18s;">✦</span>
    <span style="--x:49%; --delay:1s; --duration:14s;">🪭</span>
    <span style="--x:64%; --delay:4s; --duration:17s;">🕊️</span>
    <span style="--x:80%; --delay:3s; --duration:15s;">☁️</span>
    <span style="--x:92%; --delay:6s; --duration:19s;">✧</span>
  </div>

  <main class="page-shell">
    <section class="hero panel">
      <div class="seal">金庫</div>
      <p class="eyebrow">Sky Blue Oriental Ledger</p>
      <h1>番茄的金庫</h1>
      <p class="subtitle">只呈現試算表 A～E 欄資料，可輸入自己的名字查詢目前紀錄。</p>

      <div class="search-card" role="search">
        <label for="searchInput">輸入名字查詢</label>
        <div class="search-row">
          <input id="searchInput" type="search" autocomplete="off" placeholder="例：方方、念念、Sakura…" />
          <button id="clearBtn" type="button">顯示全部</button>
        </div>
        <p id="resultText" class="result-text">資料載入中…</p>
      </div>
    </section>

    <section class="summary-grid" id="summaryGrid" aria-label="統計摘要"></section>

    <section class="panel content-panel" aria-label="存鑽資料查詢結果">
      <div id="cards" class="cards" aria-live="polite"></div>

      <div class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <span>☁️ 以天空藍古風樣式設計</span>
    <span>｜</span>
    <span>GitHub Pages 靜態網站</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>

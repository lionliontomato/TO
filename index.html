<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>番茄の金庫</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="sky-glow"></div>
  <div class="mist mist-a"></div>
  <div class="mist mist-b"></div>

  <!-- 漂浮物：集中左右兩側，中間保留給主要內容 -->
  <div class="floating-icons">
    <span style="--x: 3%; --duration: 28s; --delay: 0s; --size: 30px; --move: 42px;">✦</span>
    <span style="--x: 8%; --duration: 34s; --delay: 4s; --size: 36px; --move: 30px;">☁️</span>
    <span style="--x: 14%; --duration: 32s; --delay: 8s; --size: 34px; --move: 50px;">🂡</span>
    <span style="--x: 21%; --duration: 40s; --delay: 2s; --size: 26px; --move: 36px;">✧</span>
    <span style="--x: 27%; --duration: 38s; --delay: 11s; --size: 24px; --move: 28px;">✦</span>

    <span style="--x: 74%; --duration: 36s; --delay: 5s; --size: 32px; --move: -38px;">🪶</span>
    <span style="--x: 81%; --duration: 31s; --delay: 1s; --size: 34px; --move: -44px;">🃁</span>
    <span style="--x: 88%; --duration: 38s; --delay: 7s; --size: 34px; --move: -32px;">🕊️</span>
    <span style="--x: 94%; --duration: 30s; --delay: 3s; --size: 28px; --move: -46px;">✦</span>
    <span style="--x: 97%; --duration: 42s; --delay: 10s; --size: 24px; --move: -34px;">✧</span>
  </div>

  <main class="page-shell">
    <section class="panel hero">
      <div class="seal">歡茄</div>

      <p class="eyebrow">☁️ ✦ ️ ✧</p>

      <h1 id="siteTitle">番茄の金庫</h1>

      <p id="siteSubtitle" class="subtitle">
        多吃番茄身體好。
      </p>

      <div class="search-card">
        <label for="searchInput">懶得找就來查查看</label>

        <div class="search-row">
          <input
            type="search"
            id="searchInput"
            placeholder="輸入名字搜尋..."
            autocomplete="off"
          />
          <button id="clearBtn" type="button">顯示全部</button>
        </div>

        <p id="resultText" class="result-text">資料載入中…</p>
      </div>
    </section>

    <section class="content-panel">
      <div class="section-head">
        <h2>資料列表</h2>
        <p class="source-note">自動連結 Google 試算表資料</p>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr id="tableHead"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>☁️ 謝謝大家的支持 ｜ 我愛天空藍，天空藍愛我</p>
    <p>© 2026 LionLionTomato. All Rights Reserved.</p>
    <p>
      本網站「番茄の金庫」之頁面設計、程式架構、資料整理方式與視覺呈現，未經授權不得重製、改作或商業使用。
    </p>
    <p>
      <a href="terms.html">著作權聲明與使用條款</a>
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>

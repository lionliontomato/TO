        <div class="search-row">
          <input

            id="searchInput"
            placeholder="輸入名字搜尋..."
            autocomplete="off"
          />
          <button id="clearBtn" type="button">顯示全部</button>
        </div>

        <p id="resultText" class="result-text">資料載入中…</p>
      </div>
    </section>

    <section class="content-panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr id="tableHead"></tr>
          </thead>
          <tbody id="tableBody"></tbody>

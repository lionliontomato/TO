<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>番茄的金庫</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700&family=Poppins:wght@700&family=Roboto:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<header>
<h1>🍅番茄的金庫</h1>
<input type="text" id="searchInput" placeholder="搜尋名字..." />
</header>

<main>
<div class="table headerRow">
  <div class="cell indexCol">序號</div>
  <div class="cell ownerCol">存鑽老闆</div>
  <div class="cell diamondCol">存鑽數量</div>
  <div class="cell songCol">存歌數量</div>
  <div class="cell bombCol">存爆數量</div>
  <div class="cell totalCol">總數</div>
</div>
<div id="cardsContainer" class="table"></div>
</main>

<div id="floatingBubbles"></div>

<script src="app.js"></script>
</body>
</html>
